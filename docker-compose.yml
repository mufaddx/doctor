version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: toc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-touch_of_cure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [toc_network]

  redis:
    image: redis:7-alpine
    container_name: toc_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [toc_network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toc_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-touch_of_cure}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - '3000:3000'
    # Migrations run before the app boots so the schema is always current
    command: sh -c "npx prisma migrate deploy && node dist/main"
    networks: [toc_network]

  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: toc_admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    depends_on: [backend]
    ports:
      - '3001:3000'
    networks: [toc_network]

  nginx:
    image: nginx:1.27-alpine
    container_name: toc_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on: [backend, admin]
    networks: [toc_network]

volumes:
  postgres_data:
  redis_data:

networks:
  toc_network:
    driver: bridge
