name: Patient App - Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./patient-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # agora_rtc_engine ships two AARs that declare the same manifest
      # package, which AGP rejects as a duplicate namespace. This rebuilds a
      # patched copy locally instead of committing a ~140MB binary.
      - name: Patch agora-special-full AAR
        run: python3 android/patch_agora_aar.py

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }} \
            --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            -PMAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: patient-app-release-apk
          path: patient-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
