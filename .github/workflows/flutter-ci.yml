name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths: ['patient-app/**', 'therapist-app/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['patient-app/**', 'therapist-app/**']

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [patient-app, therapist-app]

    defaults:
      run:
        working-directory: ./${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  build-android:
    name: Build Android release
    needs: analyze
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [patient-app, therapist-app]

    defaults:
      run:
        working-directory: ./${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release
          path: ${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
          retention-days: 14
