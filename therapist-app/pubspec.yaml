name: touch_of_cure_therapist
description: Touch of Cure - Doctor App. For physiotherapists managing appointments and patients.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.6
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  agora_rtc_engine: ^6.5.0
  permission_handler: ^11.3.1
  socket_io_client: ^2.0.3+1

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  table_calendar: ^3.1.3
  pinput: ^5.0.0
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
